<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMRC — Visual Chapter Guide</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #eef1f7;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}

/* ── STICKY HEADER ── */
#topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: linear-gradient(100deg, #0f1628 0%, #162040 100%);
  padding: 12px 16px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
#topbar .sub {
  font-size: 10px;
  color: #7aaccc;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 2px;
}
#topbar h1 {
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.3px;
  line-height: 1.2;
  margin-bottom: 10px;
}

/* ── TAB BAR ── */
#tabbar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  align-items: center;
}
#tabbar::-webkit-scrollbar { display: none; }

.part-badge {
  font-size: 9px;
  font-weight: 800;
  color: #fff;
  border-radius: 5px;
  padding: 3px 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  flex-shrink: 0;
  white-space: nowrap;
}
.part-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.tab-btn {
  flex-shrink: 0;
  padding: 6px 11px;
  border-radius: 8px;
  border: 2px solid transparent;
  background: rgba(255,255,255,0.1);
  color: #ccd8e8;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: inherit;
  white-space: nowrap;
}
.tab-btn.active {
  border-color: var(--acc);
  background: var(--chcol);
  color: var(--acc);
}

/* ── MAIN CONTENT ── */
#content {
  padding: 16px 14px 40px;
  max-width: 680px;
  margin: 0 auto;
}

/* ── CHAPTER HEADER ── */
.ch-header {
  border-radius: 16px;
  padding: 18px 16px;
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
  border: 2px solid transparent;
}
.ch-header-deco {
  position: absolute;
  top: -30px; right: -30px;
  width: 110px; height: 110px;
  border-radius: 50%;
  opacity: 0.07;
  pointer-events: none;
}
.ch-header-top {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 12px;
}
.ch-icon { font-size: 36px; line-height: 1; flex-shrink: 0; }
.ch-num-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.ch-title {
  font-size: 19px;
  font-weight: 800;
  color: #0f1628;
  letter-spacing: -0.4px;
  line-height: 1.25;
}
.ch-summary {
  font-size: 14px;
  color: #2a2a4a;
  line-height: 1.7;
}
.ch-note {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
  font-size: 12.5px;
  color: #444;
  line-height: 1.55;
}

/* ── FORMULAS HEADING ── */
.formulas-heading {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #667;
  margin-bottom: 12px;
}
.sigma-badge {
  width: 24px; height: 24px;
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-family: Georgia, serif;
  flex-shrink: 0;
}

/* ── FORMULA CARD ── */
.formula-card { margin-bottom: 10px; }

.formula-btn {
  width: 100%;
  text-align: left;
  background: #fff;
  border: 1.5px solid #dde5f0;
  border-radius: 10px;
  padding: 13px 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
  transition: border-color 0.15s;
}
.formula-btn.open {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}
.formula-btn-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}
.formula-label-text {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  line-height: 1.4;
}
.formula-toggle {
  font-size: 11px;
  color: #aaa;
  flex-shrink: 0;
  margin-top: 1px;
  transition: transform 0.15s;
}
.formula-toggle.open { transform: rotate(180deg); }
.formula-math {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 15px;
  color: #0f1628;
  background: #f4f6fa;
  border-radius: 7px;
  padding: 9px 13px;
  line-height: 1.6;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.formula-vars {
  border: 1.5px solid var(--acc);
  border-top: none;
  border-bottom-left-radius: 10px;
  border-bottom-right-radius: 10px;
  padding: 12px 14px 8px;
  background: #fafbfd;
  display: none;
}
.formula-vars.open { display: block; }
.vars-heading {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #999;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.var-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 0 12px;
  margin-bottom: 11px;
  align-items: start;
}
.var-sym {
  font-family: Georgia, serif;
  font-weight: 700;
  font-size: 14px;
  padding-top: 1px;
  word-break: break-all;
}
.var-desc {
  font-size: 13.5px;
  color: #333;
  line-height: 1.55;
}

/* ── EXAM Q&A ── */
.qa-question {
  font-size: 14.5px;
  font-weight: 600;
  color: #0f1628;
  line-height: 1.5;
}
.qa-answer {
  font-size: 13.5px;
  color: #333;
  line-height: 1.6;
}
.exam-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}
.exam-tag {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  border: 1px solid;
  border-radius: 5px;
  padding: 2px 6px;
  white-space: nowrap;
}

/* ── APPLIED CHAPTER ── */
.applied-box {
  background: #fff;
  border: 2px dashed #cdd5e0;
  border-radius: 14px;
  padding: 32px 20px;
  text-align: center;
  color: #8899aa;
}
.applied-box .big-icon { font-size: 32px; margin-bottom: 10px; }
.applied-box h3 { font-size: 15px; font-weight: 700; color: #4a5870; margin-bottom: 6px; }
.applied-box p { font-size: 13px; line-height: 1.65; }

/* ── NAV ── */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1.5px solid #dde5f0;
}
.nav-btn {
  padding: 11px 20px;
  border-radius: 10px;
  border: 1.5px solid #c8d4e0;
  background: #fff;
  font-size: 14px;
  font-weight: 600;
  color: #334;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  min-width: 100px;
  font-family: inherit;
  transition: opacity 0.15s;
}
.nav-btn:disabled { opacity: 0.4; cursor: default; }
.nav-counter { font-size: 12px; color: #889; font-weight: 600; }

/* ── FADE ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
#content { animation: fadeIn 0.2s ease; }
</style>
</head>
<body>

<div id="topbar">
  <div class="sub">TU Wien · Prof. Dr. Peter Filzmoser</div>
  <h1>AMRC — Visual Chapter Guide</h1>
  <div id="tabbar"></div>
</div>

<div id="content"></div>

<script>
const chapters = [
  {
    id:1, part:"I", partLabel:"Fundamentals", num:"Ch 1",
    title:"The Linear Regression Model",
    color:"#e8f4f8", accent:"#1a6b8a", icon:"📐",
    summary:"Describes a response variable y as a linear combination of input predictors. The unknown coefficients are estimated by minimising the sum of squared residuals.",
    formulas:[
      { label:"The linear model", latex:"y = β₀ + x₁β₁ + … + xₚβₚ + ε",
        vars:[
          {sym:"y",         desc:"Response (output) variable — what you want to predict"},
          {sym:"β₀",        desc:"Intercept — the predicted value when all xⱼ = 0"},
          {sym:"βⱼ",        desc:"Coefficient for predictor j — how much y changes per unit of xⱼ"},
          {sym:"xⱼ",        desc:"The j-th predictor (input) variable, j = 1, …, p"},
          {sym:"ε",         desc:"Error term — assumed εᵢ ~ N(0, σ²), i.e. normally distributed noise"},
        ]},
      { label:"Least-squares estimator (OLS)", latex:"β̂ = (XᵀX)⁻¹ Xᵀy",
        vars:[
          {sym:"β̂",        desc:"Vector of estimated coefficients (β̂₀, β̂₁, …, β̂ₚ)"},
          {sym:"X",         desc:"Design matrix — n × (p+1) matrix whose rows are observations (1, xᵢ₁, …, xᵢₚ)"},
          {sym:"Xᵀ",        desc:"Transpose of the design matrix"},
          {sym:"(XᵀX)⁻¹",  desc:"Inverse of the Gram matrix — exists only when X has full column rank"},
          {sym:"y",         desc:"n-vector of observed response values (y₁, …, yₙ)"},
        ]},
      { label:"Hat matrix (fitted values)", latex:"ŷ = Hy,   H = X(XᵀX)⁻¹Xᵀ",
        vars:[
          {sym:"ŷ", desc:"Vector of fitted (predicted) values"},
          {sym:"H", desc:"Hat matrix — projects y onto the column space of X; 'puts the hat on y'"},
        ]},
      { label:"t-statistic for testing βⱼ = 0", latex:"zⱼ = β̂ⱼ / (σ̂ √dⱼ),   under H₀: zⱼ ~ tₙ₋ₚ₋₁",
        vars:[
          {sym:"β̂ⱼ", desc:"Estimated coefficient for predictor j"},
          {sym:"σ̂",  desc:"Estimated residual standard deviation: σ̂² = RSS/(n−p−1)"},
          {sym:"dⱼ",  desc:"j-th diagonal element of (XᵀX)⁻¹ — scales the standard error of β̂ⱼ"},
          {sym:"zⱼ",  desc:"Test statistic; under H₀ distributed as tₙ₋ₚ₋₁"},
        ]},
      { label:"Distribution of the LS estimator", latex:"β̂ ~ Nₚ₊₁(β, σ²(XᵀX)⁻¹)",
        vars:[
          {sym:"β",            desc:"True (unknown) coefficient vector — β̂ is unbiased: E(β̂) = β"},
          {sym:"σ²(XᵀX)⁻¹",   desc:"Covariance matrix of β̂ — its diagonal gives the squared standard errors; blows up when XᵀX is near-singular (correlated predictors)"},
          {sym:"σ²",           desc:"Residual variance, estimated by σ̂² = RSS/(n−p−1)"},
        ]},
    ]
  },
  {
    id:2, part:"I", partLabel:"Fundamentals", num:"Ch 2",
    title:"Model Comparison & Selection",
    color:"#f0f8ee", accent:"#2d7a3a", icon:"⚖️",
    summary:"Provides tools to choose among competing models: F-tests compare nested models, information criteria (AIC, BIC) balance fit vs. complexity, and resampling methods estimate prediction error.",
    formulas:[
      { label:"F-statistic (nested models)", latex:"F = [(RSS₀ − RSS₁)/(p₁−p₀)] / [RSS₁/(n−p₁−1)]",
        vars:[
          {sym:"RSS₀",    desc:"Residual sum of squares of the smaller model M₀ (with p₀ predictors)"},
          {sym:"RSS₁",    desc:"Residual sum of squares of the larger model M₁ (with p₁ predictors)"},
          {sym:"p₁ − p₀", desc:"Number of additional parameters in M₁ versus M₀"},
          {sym:"n",        desc:"Total number of observations"},
          {sym:"F",        desc:"Under H₀ (smaller model correct) distributed as F_{p₁−p₀, n−p₁−1}"},
        ]},
      { label:"Coefficient of determination R²", latex:"R² = 1 − RSS/TSS = RegSS/TSS",
        vars:[
          {sym:"RSS",   desc:"Residual sum of squares Σ(yᵢ − ŷᵢ)²"},
          {sym:"TSS",   desc:"Total sum of squares Σ(yᵢ − ȳ)² — total variance in y"},
          {sym:"RegSS", desc:"Regression sum of squares Σ(ŷᵢ − ȳ)² — variance explained by the model"},
          {sym:"R²",    desc:"Proportion of variance explained; R² ∈ [0,1], larger is better"},
        ]},
      { label:"AIC — Akaike Information Criterion", latex:"AIC = −2 max log L + 2p",
        vars:[
          {sym:"max log L", desc:"Maximised log-likelihood — measures how well the model fits"},
          {sym:"p",         desc:"Number of estimated parameters — the penalty for complexity"},
          {sym:"AIC",       desc:"Select the model with minimum AIC. When σ² unknown: AIC = n·log(RSS/n) + 2p"},
        ]},
      { label:"BIC — Bayesian Information Criterion", latex:"BIC = −2 max log L + log(n)·p",
        vars:[
          {sym:"log(n)", desc:"Natural log of sample size — grows with n, penalises more than AIC for n ≥ 8 (i.e. more than e² = 7.3 observations)"},
          {sym:"p",      desc:"Number of parameters"},
        ]},
      { label:"Cross-validation error", latex:"ÊrrCV = (1/n) Σᵢ L(yᵢ, ŷᵢ)",
        vars:[
          {sym:"L(yᵢ, ŷᵢ)", desc:"Loss function comparing observed yᵢ to out-of-fold prediction ŷᵢ — quadratic (yᵢ−ŷᵢ)² or absolute error"},
          {sym:"ŷᵢ",         desc:"Prediction for i using the model fitted on the other q−1 folds (q-fold CV; q=5 or 10 preferred, q=n is leave-one-out)"},
        ]},
    ]
  },
  {
    id:3, part:"II", partLabel:"Linear Regression", num:"Ch 3",
    title:"Linear Methods",
    color:"#fdf3e8", accent:"#a85c00", icon:"🔧",
    summary:"Beyond ordinary least squares: PCR and PLS use derived components to handle correlated predictors, while Ridge and Lasso impose penalties to shrink coefficients and reduce variance.",
    formulas:[
      { label:"Bias-Variance decomposition of MSE", latex:"MSE = σ² + Var(ŷ) + [E(y − ŷ)]²",
        vars:[
          {sym:"σ²",          desc:"Irreducible error — inherent noise in the data, cannot be reduced"},
          {sym:"Var(ŷ)",       desc:"Variance of the prediction — how much ŷ changes across different training sets"},
          {sym:"[E(y − ŷ)]²", desc:"Squared bias — systematic error; zero for unbiased estimators like OLS"},
        ]},
      { label:"Ridge regression", latex:"β̂Ridge = argmin{ Σ(yᵢ−β₀−Σxᵢⱼβⱼ)² + λ Σβⱼ² }",
        vars:[
          {sym:"λ ≥ 0",   desc:"Tuning parameter — larger λ means stronger shrinkage toward zero"},
          {sym:"Σβⱼ²",    desc:"L2 penalty — sum of squared coefficients; penalises large coefficients"},
          {sym:"β̂Ridge", desc:"Closed-form solution: (XᵀX + λI)⁻¹Xᵀy — never exactly zero, shrinks all"},
        ]},
      { label:"Lasso regression", latex:"β̂Lasso = argmin{ Σ(yᵢ−β₀−Σxᵢⱼβⱼ)² + λ Σ|βⱼ| },   equiv. constraint form: Σ|βⱼ| ≤ s",
        vars:[
          {sym:"Σ|βⱼ|",   desc:"L1 penalty — diamond-shaped constraint drives some coefficients to exactly zero (variable selection)"},
          {sym:"λ",        desc:"Tuning parameter — increasing λ progressively zeros out more coefficients"},
          {sym:"s",        desc:"Equivalent form: Σ|βⱼ| ≤ s — directly bounds total coefficient magnitude"},
        ]},
      { label:"Ridge via SVD — shrinkage & degrees of freedom", latex:"ŷRidge = Σⱼ uⱼ [dⱼ²/(dⱼ²+λ)] uⱼᵀy,   df(λ) = trace(X(XᵀX+λI)⁻¹Xᵀ) = Σⱼ dⱼ²/(dⱼ²+λ)",
        vars:[
          {sym:"uⱼ",            desc:"j-th left singular vector of X (from the SVD X = UDVᵀ) — the j-th principal-component direction"},
          {sym:"dⱼ",            desc:"j-th singular value of X; dⱼ² is proportional to the variance of principal component j"},
          {sym:"dⱼ²/(dⱼ²+λ)",  desc:"Shrinkage factor ∈ (0,1] — ridge shrinks each component by this; low-variance (small dⱼ²) directions are shrunk most, vs PCR which discards them entirely"},
          {sym:"df(λ)",         desc:"Effective degrees of freedom; λ=0 → p, λ→∞ → 0"},
        ]},
      { label:"PCR — spectral decomposition (p. 18)", latex:"Cov(X) = VAVᵀ,   Z = XV",
        vars:[
          {sym:"V",   desc:"p × p matrix of eigenvectors of Cov(X) — each column vᵢ is a principal component direction"},
          {sym:"A",   desc:"Diagonal matrix of eigenvalues a₁ ≥ a₂ ≥ … ≥ aₚ — variance explained by each component"},
          {sym:"Z",   desc:"Score matrix — n × p matrix of principal component values; columns of Z are uncorrelated"},
        ]},
      { label:"PCR — reduced model estimator (p. 19)", latex:"θ̂₁:q = (Z₁:qᵀZ₁:q)⁻¹ Z₁:qᵀy,   β̃ = V₁:q θ̂₁:q",
        vars:[
          {sym:"q",       desc:"Number of principal components retained (1 ≤ q < p) — chosen by CV"},
          {sym:"Z₁:q",    desc:"First q columns of Z — the q most variable components of X"},
          {sym:"θ̂₁:q",   desc:"OLS coefficients in the reduced PC space"},
          {sym:"β̃",      desc:"Back-transformed coefficients in the original variable space: β̃ = V₁:q θ̂₁:q"},
        ]},
      { label:"PLS — loading direction (p. 20)", latex:"wₖ = argmax Cov(y, Xw)   s.t. ‖wₖ‖=1, Cov(Xwₖ,Xwⱼ)=0 for j<k;   T = XW",
        vars:[
          {sym:"wₖ",             desc:"k-th PLS loading vector — direction in X-space most correlated with y"},
          {sym:"Cov(y, Xw)",     desc:"Covariance between y and the projection Xw — PLS maximises this directly"},
          {sym:"Cov(Xwₖ,Xwⱼ)=0", desc:"Orthogonality constraint — each new component must be uncorrelated with previous ones"},
          {sym:"T = XW",         desc:"Score matrix — columns tₖ = Xwₖ are the PLS components used for regression"},
        ]},
      { label:"Continuum regression direction (p. 20)", latex:"wₖ = argmax [Cov(y,Xw)]² [Var(Xw)]^(δ/(1−δ)−1)   s.t. ‖wₖ‖=1, Cov(Xwₖ,Xwⱼ)=0 for j<k",
        vars:[
          {sym:"wₖ",          desc:"k-th loading direction (k = 1,…,q ≤ p) — regression is then done on y and T = XW, as in PLS"},
          {sym:"δ ∈ [0,1]",  desc:"Mixing parameter: δ=0 → LS, δ=0.5 → PLS, δ=1 → PCR"},
          {sym:"Cov(y, Xw)", desc:"Covariance between y and projection Xw — captures relevance for predicting y"},
          {sym:"Var(Xw)",    desc:"Variance of the projection — captures how much of X's structure it explains"},
        ]},
    ]
  },
  {
    id:5, part:"III", partLabel:"Linear Classification", num:"Ch 5",
    title:"Linear Classification",
    color:"#fff0f0", accent:"#a02020", icon:"🎯",
    summary:"Assigns observations to classes using linear decision boundaries. LDA assumes Gaussian classes with equal covariance; QDA relaxes that; logistic regression models class probabilities directly.",
    formulas:[
      { label:"Bayes classification rule (posterior)", latex:"P(G=k|x) = hₖ(x)πₖ / Σₗ hₗ(x)πₗ",
        vars:[
          {sym:"P(G=k|x)",      desc:"Posterior probability that x belongs to class k; classify x to the class with the largest posterior"},
          {sym:"hₖ(x)",         desc:"Class-conditional density (likelihood) of x in class k — in LDA/QDA assumed multivariate Gaussian φₖ"},
          {sym:"πₖ",            desc:"Prior probability of class k, estimated as nₖ/n"},
          {sym:"Σₗ hₗ(x)πₗ",   desc:"Normalising constant (total probability) — makes the posteriors sum to 1"},
        ]},
      { label:"LDA linear discriminant function", latex:"δₖ(x) = xᵀΣ⁻¹μₖ − ½μₖᵀΣ⁻¹μₖ + log πₖ",
        vars:[
          {sym:"x",      desc:"New observation (p-dimensional feature vector) to classify"},
          {sym:"μₖ",     desc:"Mean vector of class k — sample mean of training points in class k"},
          {sym:"Σ",      desc:"Pooled (common) covariance matrix — assumed equal across all classes"},
          {sym:"πₖ",     desc:"Prior probability of class k — estimated as nₖ/n"},
          {sym:"δₖ(x)",  desc:"Score for class k; classify x to argmax_k δₖ(x)"},
        ]},
      { label:"QDA quadratic discriminant function", latex:"δₖ(x) = −½log|Σₖ| − ½(x−μₖ)ᵀΣₖ⁻¹(x−μₖ) + log πₖ",
        vars:[
          {sym:"|Σₖ|",                desc:"Determinant of class-specific covariance Σₖ — penalises spread"},
          {sym:"(x−μₖ)ᵀΣₖ⁻¹(x−μₖ)", desc:"Mahalanobis distance from x to class k centre"},
          {sym:"Σₖ",                  desc:"Class-specific covariance — QDA estimates a separate Σₖ per class"},
        ]},
      { label:"Regularised discriminant covariance", latex:"Σ̂ₖ(α) = αΣ̂ₖ + (1−α)Σ̂",
        vars:[
          {sym:"α ∈ [0,1]", desc:"α=0 → LDA (pooled Σ), α=1 → QDA (class-specific Σ)"},
          {sym:"Σ̂ₖ",        desc:"Sample covariance of class k"},
          {sym:"Σ̂",         desc:"Pooled covariance: weighted average across all classes"},
        ]},
      { label:"Logistic regression (K classes, p. 51)", latex:"log P(G=k|x)/P(G=K|x) = βₖ₀ + βₖᵀx   for k = 1,…,K−1",
        vars:[
          {sym:"P(G=k|x)/P(G=K|x)", desc:"Log-odds of class k relative to the reference class K — each pair of classes gets its own linear model"},
          {sym:"βₖ₀",               desc:"Intercept for class k — one per non-reference class"},
          {sym:"βₖ",                desc:"p-vector of coefficients for class k"},
          {sym:"K",                 desc:"Reference class — choice is arbitrary; estimates are equivariant under different choices"},
          {sym:"P(G=k|x)",          desc:"Posterior probability for class k: exp{βₖ₀+βₖᵀx} / [1 + Σₗ exp{βₗ₀+βₗᵀx}]"},
          {sym:"P(G=K|x)",          desc:"Posterior probability for reference class K: 1 / [1 + Σₗ exp{βₗ₀+βₗᵀx}]"},
        ]},
      { label:"Logistic regression (2 classes, p. 51)", latex:"P(G=1|x) = exp(β₀+β₁ᵀx) / [1 + exp(β₀+β₁ᵀx)]",
        vars:[

      formula:"min ½‖β‖² + C Σᵢ ξᵢ   s.t.  gᵢ(xᵢᵀβ + β₀) ≥ 1 − ξᵢ,  ξᵢ ≥ 0",
      a:"When the classes overlap, introduce a slack ξᵢ ≥ 0 for each point (how far it lies on the wrong side of its margin) and minimise ½‖β‖² + CΣξᵢ subject to gᵢ(xᵢᵀβ + β₀) ≥ 1 − ξᵢ. The cost C tunes the trade-off: large C → narrow margin, few violations (risk of overfitting); small C → wider, smoother margin. ξᵢ > 1 means xᵢ is misclassified. Solving via Lagrange/KKT gives β = Σᵢ αᵢ gᵢ xᵢ with 0 ≤ αᵢ ≤ C.",
      asked:["Jan 2025","Feb 2025 ②"] },
    { q:"SVM: f(x) = β₀ + βᵀx = 0. Give the solution for β. What are support vectors?",
      formula:"β = Σᵢ αᵢ gᵢ xᵢ,   Σᵢ αᵢ gᵢ = 0,   0 ≤ αᵢ (≤ C)",
      a:"From the Karush-Kuhn-Tucker conditions the solution is β = Σᵢ αᵢ gᵢ xᵢ — a linear combination of the training points — with Σᵢ αᵢ gᵢ = 0 and αᵢ ≥ 0 (and αᵢ ≤ C in the non-separable case). Only the points with αᵢ > 0 contribute: these are the support vectors. They lie on the margin boundary (gᵢ(xᵢᵀβ+β₀)=1, with 0 < αᵢ < C) or, when not separable, on the wrong side (ξᵢ > 0, αᵢ = C). The intercept β₀ comes from any margin support vector via gᵢ(xᵢᵀβ+β₀) = 1; points outside the margin have αᵢ = 0.",
      asked:["4 Feb 2026"] },
    { q:"What is the kernel trick?",
      formula:"K(u,v) = ⟨h(u), h(v)⟩;   f(x) = Σᵢ αᵢ gᵢ ⟨h(x), h(xᵢ)⟩ + β₀",
      a:"Map the data through h(x) into a higher-dimensional space where it is linearly separable. Both the dual optimisation problem and the solution f(x) = Σᵢ αᵢ gᵢ ⟨h(x), h(xᵢ)⟩ + β₀ involve h only through inner products — so we never compute h explicitly; we only need a kernel function K(u,v) = ⟨h(u),h(v)⟩ that returns the inner product in the transformed space directly, giving f(x) = Σᵢ αᵢ gᵢ K(x, xᵢ) + β₀.",
      asked:["26 Jan 2026"] },
  ],
};

let activeId = 1;

// ── Build tab bar ──────────────────────────────────────────────
function buildTabBar() {
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  ['I','II','III','IV'].forEach(part => {
    const group = document.createElement('div');
    group.className = 'part-group';

    const badge = document.createElement('div');
    badge.className = 'part-badge';
    badge.style.background = partMeta[part].bg;
    badge.textContent = partMeta[part].label;
    group.appendChild(badge);

    chapters.filter(c => c.part === part).forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (ch.id === activeId ? ' active' : '');
      btn.style.setProperty('--acc', ch.accent);
      btn.style.setProperty('--chcol', ch.color);
      btn.dataset.id = ch.id;
      btn.innerHTML = `<span style="font-size:13px">${ch.icon}</span><span>${ch.num}</span>`;
      btn.addEventListener('click', () => goTo(ch.id));
      if (ch.id === activeId) btn.dataset.active = '1';
      group.appendChild(btn);
    });
    bar.appendChild(group);
  });

  // Scroll active tab into view
  const activeBtn = bar.querySelector('[data-active]');
  if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

// ── Build chapter content ──────────────────────────────────────
function buildContent() {
  const activeIndex = chapters.findIndex(c => c.id === activeId);
  const ch = chapters[activeIndex];
  const content = document.getElementById('content');

  const noteHTML = ch.note
    ? `<div class="ch-note" style="border-left:3px solid ${ch.accent};background:${ch.accent}18">
        <strong style="color:${ch.accent}">Note: </strong>${ch.note}
       </div>`
    : '';

  let formulasHTML = '';
  if (ch.formulas.length > 0) {
    const cards = ch.formulas.map((f, fi) => `
      <div class="formula-card">
        <button class="formula-btn" id="fb-${fi}" onclick="toggleFormula(${fi},'${ch.accent}')" style="--acc:${ch.accent}">
          <div class="formula-btn-top">
            <span class="formula-label-text" style="color:${ch.accent}">${f.label}</span>
            <span class="formula-toggle" id="ft-${fi}">▼</span>
          </div>
          <div class="formula-math">${f.latex}</div>
        </button>
        <div class="formula-vars" id="fv-${fi}" style="--acc:${ch.accent}">
          <div class="vars-heading">Variable guide</div>
          ${f.vars.map(v => `
            <div class="var-row">
              <span class="var-sym" style="color:${ch.accent}">${v.sym}</span>
              <span class="var-desc">${v.desc}</span>
            </div>`).join('')}
        </div>
      </div>`).join('');

    formulasHTML = `
      <div class="formulas-heading">
        <div class="sigma-badge" style="background:${ch.accent}">Σ</div>
        Key Formulas — tap to expand variables
      </div>
      ${cards}`;
  } else {
    formulasHTML = `
      <div class="applied-box">
        <div class="big-icon">💻</div>
        <h3>Applied Chapter</h3>
        <p>This chapter focuses on R implementation and worked examples.<br>
           Theoretical formulas are in the corresponding theory chapter.</p>
      </div>`;
  }

  // ── Exam Q&A for this chapter (indices continue after the formulas) ──
  let examHTML = '';
  const qa = examQA[ch.id];
  if (qa && qa.length > 0) {
    const offset = (ch.formulas ? ch.formulas.length : 0);
    const cards = qa.map((item, qi) => {
      const fi = offset + qi;
      const tags = (item.asked || []).map(d =>
        `<span class="exam-tag" style="color:${ch.accent};border-color:${ch.accent}55">${d}</span>`).join('');
      return `
      <div class="formula-card">
        <button class="formula-btn" id="fb-${fi}" onclick="toggleFormula(${fi},'${ch.accent}')" style="--acc:${ch.accent}">
          <div class="formula-btn-top">
            <span class="formula-label-text" style="color:${ch.accent}">Q${qi + 1}</span>
            <span class="formula-toggle" id="ft-${fi}">▼</span>
          </div>
          <div class="qa-question">${item.q}</div>
          <div class="exam-tags">${tags}</div>
        </button>
        <div class="formula-vars" id="fv-${fi}" style="--acc:${ch.accent}">
          ${item.formula ? `<div class="formula-math" style="margin-bottom:10px">${item.formula}</div>` : ''}
          <div class="vars-heading">Answer</div>
          <div class="qa-answer">${item.a}</div>
        </div>
      </div>`;
    }).join('');

    examHTML = `
      <div class="formulas-heading" style="margin-top:22px">
        <div class="sigma-badge" style="background:${ch.accent}">?</div>
        Exam Questions (2025–2026) — tap to reveal the answer
      </div>
      ${cards}`;
  }

  content.innerHTML = `
    <div class="ch-header" style="background:${ch.color};border-color:${ch.accent}30">
      <div class="ch-header-deco" style="background:${ch.accent}"></div>
      <div class="ch-header-top">
        <span class="ch-icon">${ch.icon}</span>
        <div>
          <div class="ch-num-label" style="color:${ch.accent}">${ch.num} · ${ch.partLabel}</div>
          <div class="ch-title">${ch.title}</div>
        </div>
      </div>
      <p class="ch-summary">${ch.summary}</p>
      ${noteHTML}
    </div>

    ${formulasHTML}

    ${examHTML}

    <div class="nav-bar">
      <button class="nav-btn" onclick="goByOffset(-1)" ${activeIndex === 0 ? 'disabled' : ''}>← Prev</button>
      <span class="nav-counter">${activeIndex + 1} / ${chapters.length}</span>
      <button class="nav-btn" onclick="goByOffset(1)" ${activeIndex === chapters.length - 1 ? 'disabled' : ''}>Next →</button>
    </div>`;
}

function toggleFormula(fi, accent) {
  const btn  = document.getElementById(`fb-${fi}`);
  const vars = document.getElementById(`fv-${fi}`);
  const tog  = document.getElementById(`ft-${fi}`);
  const open = vars.classList.contains('open');
  vars.classList.toggle('open', !open);
  btn.classList.toggle('open', !open);
  tog.classList.toggle('open', !open);
  if (!open) btn.style.borderColor = accent;
  else       btn.style.borderColor = '#dde5f0';
}

function goByOffset(offset) {
  const idx = chapters.findIndex(c => c.id === activeId);
  const next = chapters[idx + offset];
  if (next) goTo(next.id);
}

function goTo(id) {
  if (!chapters.find(c => c.id === id)) return;
  activeId = id;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  buildTabBar();
  buildContent();
}

render();
</script>
</body>
</html>
