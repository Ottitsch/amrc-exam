<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMRC — Visual Chapter Guide</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #eef1f7;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}

/* ── STICKY HEADER ── */
#topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: linear-gradient(100deg, #0f1628 0%, #162040 100%);
  padding: 12px 16px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
#topbar .sub {
  font-size: 10px;
  color: #7aaccc;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 2px;
}
#topbar h1 {
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.3px;
  line-height: 1.2;
}
#topbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
#exam-toggle {
  flex-shrink: 0;
  padding: 5px 11px;
  border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,0.35);
  background: transparent;
  color: #ccd8e8;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.4px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.15s;
}
#exam-toggle.on {
  background: #f5b942;
  border-color: #f5b942;
  color: #0f1628;
}

/* ── TAB BAR ── */
#tabbar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  align-items: center;
}
#tabbar::-webkit-scrollbar { display: none; }

.part-badge {
  font-size: 9px;
  font-weight: 800;
  color: #fff;
  border-radius: 5px;
  padding: 3px 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  flex-shrink: 0;
  white-space: nowrap;
}
.part-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.tab-btn {
  flex-shrink: 0;
  padding: 6px 11px;
  border-radius: 8px;
  border: 2px solid transparent;
  background: rgba(255,255,255,0.1);
  color: #ccd8e8;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: inherit;
  white-space: nowrap;
}
.tab-btn.active {
  border-color: var(--acc);
  background: var(--chcol);
  color: var(--acc);
}

/* ── MAIN CONTENT ── */
#content {
  padding: 16px 14px 40px;
  max-width: 680px;
  margin: 0 auto;
}

/* ── CHAPTER HEADER ── */
.ch-header {
  border-radius: 16px;
  padding: 18px 16px;
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
  border: 2px solid transparent;
}
.ch-header-deco {
  position: absolute;
  top: -30px; right: -30px;
  width: 110px; height: 110px;
  border-radius: 50%;
  opacity: 0.07;
  pointer-events: none;
}
.ch-header-top {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 12px;
}
.ch-icon { font-size: 36px; line-height: 1; flex-shrink: 0; }
.ch-num-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.ch-title {
  font-size: 19px;
  font-weight: 800;
  color: #0f1628;
  letter-spacing: -0.4px;
  line-height: 1.25;
}
.ch-summary {
  font-size: 14px;
  color: #2a2a4a;
  line-height: 1.7;
}
.ch-note {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
  font-size: 12.5px;
  color: #444;
  line-height: 1.55;
}

/* ── FIGURE CARD ── */
.figure-card {
  background: #fff;
  border: 1.5px solid #dde5f0;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 18px;
}
.figure-card img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 6px;
  background: #fff;
}
.figure-card .figure-caption {
  font-size: 12.5px;
  color: #555;
  line-height: 1.55;
  margin-top: 10px;
}

/* ── FORMULAS HEADING ── */
.formulas-heading {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #667;
  margin-bottom: 12px;
}
.sigma-badge {
  width: 24px; height: 24px;
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-family: Georgia, serif;
  flex-shrink: 0;
}

/* ── FORMULA CARD ── */
.formula-card { margin-bottom: 10px; }

.formula-btn {
  width: 100%;
  text-align: left;
  background: #fff;
  border: 1.5px solid #dde5f0;
  border-radius: 10px;
  padding: 13px 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
  transition: border-color 0.15s;
}
.formula-btn.open {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}
.formula-btn-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}
.formula-label-text {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  line-height: 1.4;
}
.formula-toggle {
  font-size: 11px;
  color: #aaa;
  flex-shrink: 0;
  margin-top: 1px;
  transition: transform 0.15s;
}
.formula-toggle.open { transform: rotate(180deg); }
.formula-math {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 13px;
  color: #0f1628;
  background: #f4f6fa;
  border-radius: 7px;
  padding: 9px 13px;
  line-height: 1.6;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.formula-math .katex-display {
  margin: 0;
  text-align: left;
}
.formula-math .katex { font-size: 1.15em; }
.var-row .katex, .qa-question .katex, .qa-answer .katex, .ch-note .katex { font-size: 1.06em; }

.formula-vars {
  border: 1.5px solid var(--acc);
  border-top: none;
  border-bottom-left-radius: 10px;
  border-bottom-right-radius: 10px;
  padding: 12px 14px 8px;
  background: #fafbfd;
  display: none;
}
.formula-vars.open { display: block; }
.vars-heading {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #999;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.var-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 0 12px;
  margin-bottom: 11px;
  align-items: start;
}
.var-sym {
  font-family: Georgia, serif;
  font-weight: 700;
  font-size: 14px;
  padding-top: 1px;
  word-break: break-all;
}
.var-desc {
  font-size: 13.5px;
  color: #333;
  line-height: 1.55;
}

/* ── EXAM Q&A ── */
.qa-question {
  font-size: 14.5px;
  font-weight: 600;
  color: #0f1628;
  line-height: 1.5;
}
.qa-answer {
  font-size: 13.5px;
  color: #333;
  line-height: 1.6;
}
.qa-short {
  font-size: 13.5px;
  color: #1f2d1f;
  line-height: 1.55;
  background: #eaf6ec;
  border-left: 3px solid #3a9a4a;
  border-radius: 0 7px 7px 0;
  padding: 8px 11px;
  margin-bottom: 10px;
}
.qa-short .tldr-label {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #3a9a4a;
  display: block;
  margin-bottom: 3px;
}
.exam-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}
.exam-tag {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  border: 1px solid;
  border-radius: 5px;
  padding: 2px 6px;
  white-space: nowrap;
}

/* ── APPLIED CHAPTER ── */
.applied-box {
  background: #fff;
  border: 2px dashed #cdd5e0;
  border-radius: 14px;
  padding: 32px 20px;
  text-align: center;
  color: #8899aa;
}
.applied-box .big-icon { font-size: 32px; margin-bottom: 10px; }
.applied-box h3 { font-size: 15px; font-weight: 700; color: #4a5870; margin-bottom: 6px; }
.applied-box p { font-size: 13px; line-height: 1.65; }

/* ── NAV ── */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1.5px solid #dde5f0;
}
.nav-btn {
  padding: 11px 20px;
  border-radius: 10px;
  border: 1.5px solid #c8d4e0;
  background: #fff;
  font-size: 14px;
  font-weight: 600;
  color: #334;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  min-width: 100px;
  font-family: inherit;
  transition: opacity 0.15s;
}
.nav-btn:disabled { opacity: 0.4; cursor: default; }
.nav-counter { font-size: 12px; color: #889; font-weight: 600; }

/* ── FADE ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
#content { animation: fadeIn 0.2s ease; }
</style>
</head>
<body>

<div id="topbar">
  <div class="sub">TU Wien · Prof. Dr. Peter Filzmoser</div>
  <div id="topbar-row">
    <h1>AMRC — Visual Chapter Guide</h1>
    <button id="exam-toggle" onclick="toggleExamMode()" title="Show only formulas that appear in past exam questions">🎯 Exam mode</button>
  </div>
  <div id="tabbar"></div>
</div>

<div id="content"></div>

<script>
const chapters = [
  {
    id:1, part:"I", partLabel:"Fundamentals", num:"Ch 1",
    title:"The Linear Regression Model",
    color:"#e8f4f8", accent:"#1a6b8a", icon:"📐",
    summary:"Describes a response variable y as a linear combination of input predictors. The unknown coefficients are estimated by minimising the sum of squared residuals.",
    formulas:[
      { label:"The linear model", latex:String.raw`y = \beta_0 + x_1\beta_1 + \cdots + x_p\beta_p + \varepsilon`,
        vars:[
          {sym:String.raw`$y$`, desc:"Response (output) variable — what you want to predict"},
          {sym:String.raw`$\beta_0$`, desc:String.raw`Intercept — the predicted value when all $x_j = 0$`},
          {sym:String.raw`$\beta_j$`, desc:String.raw`Coefficient for predictor $j$ — how much $y$ changes per unit of $x_j$`},
          {sym:String.raw`$x_j$`, desc:String.raw`The $j$-th predictor (input) variable, $j = 1, \dots, p$`},
          {sym:String.raw`$\varepsilon$`, desc:String.raw`Error term — assumed $\varepsilon_i \sim N(0, \sigma^2)$, i.e. normally distributed noise`},
        ]},
      { label:"Least-squares estimator (OLS)", latex:String.raw`\hat{\beta} = (X^\top X)^{-1} X^\top y`,
        vars:[
          {sym:String.raw`$\hat{\beta}$`, desc:String.raw`Vector of estimated coefficients $(\hat{\beta}_0, \hat{\beta}_1, \dots, \hat{\beta}_p)$`},
          {sym:String.raw`$X$`, desc:String.raw`Design matrix — $n \times (p+1)$ matrix whose rows are observations $(1, x_{i1}, \dots, x_{ip})$`},
          {sym:String.raw`$X^\top$`, desc:"Transpose of the design matrix"},
          {sym:String.raw`$(X^\top X)^{-1}$`, desc:String.raw`Inverse of the Gram matrix — exists only when $X$ has full column rank`},
          {sym:String.raw`$y$`, desc:String.raw`$n$-vector of observed response values $(y_1, \dots, y_n)$`},
        ]},
      { label:"Hat matrix (fitted values)", latex:String.raw`\hat{y} = Hy,\quad H = X(X^\top X)^{-1} X^\top`,
        vars:[
          {sym:String.raw`$\hat{y}$`, desc:"Vector of fitted (predicted) values"},
          {sym:String.raw`$H$`, desc:String.raw`Hat matrix — projects $y$ onto the column space of $X$; 'puts the hat on $y$'`},
        ]},
      { label:"t-statistic for testing βⱼ = 0", latex:String.raw`z_j = \frac{\hat{\beta}_j}{\hat{\sigma}\sqrt{d_j}},\quad \text{under } H_0:\ z_j \sim t_{n-p-1}`,
        vars:[
          {sym:String.raw`$\hat{\beta}_j$`, desc:String.raw`Estimated coefficient for predictor $j$`},
          {sym:String.raw`$\hat{\sigma}$`, desc:String.raw`Estimated residual standard deviation: $\hat{\sigma}^2 = \mathrm{RSS}/(n-p-1)$`},
          {sym:String.raw`$d_j$`, desc:String.raw`$j$-th diagonal element of $(X^\top X)^{-1}$ — scales the standard error of $\hat{\beta}_j$`},
          {sym:String.raw`$z_j$`, desc:String.raw`Test statistic; under $H_0$ distributed as $t_{n-p-1}$`},
        ]},
      { label:"Distribution of the LS estimator", latex:String.raw`\hat{\beta} \sim N_{p+1}\big(\beta,\ \sigma^2 (X^\top X)^{-1}\big)`,
        vars:[
          {sym:String.raw`$\beta$`, desc:String.raw`True (unknown) coefficient vector — $\hat{\beta}$ is unbiased: $\mathrm{E}(\hat{\beta}) = \beta$`},
          {sym:String.raw`$\sigma^2 (X^\top X)^{-1}$`, desc:String.raw`Covariance matrix of $\hat{\beta}$ — its diagonal gives the squared standard errors; blows up when $X^\top X$ is near-singular (correlated predictors)`},
          {sym:String.raw`$\sigma^2$`, desc:String.raw`Residual variance, estimated by $\hat{\sigma}^2 = \mathrm{RSS}/(n-p-1)$`},
        ]},
    ]
  },
  {
    id:2, part:"I", partLabel:"Fundamentals", num:"Ch 2",
    title:"Model Comparison & Selection",
    color:"#f0f8ee", accent:"#2d7a3a", icon:"⚖️",
    summary:"Provides tools to choose among competing models: F-tests compare nested models, information criteria (AIC, BIC) balance fit vs. complexity, and resampling methods estimate prediction error.",
    formulas:[
      { label:"F-statistic (nested models)", latex:String.raw`F = \frac{(\mathrm{RSS}_0 - \mathrm{RSS}_1)/(p_1 - p_0)}{\mathrm{RSS}_1/(n - p_1 - 1)}`,
        vars:[
          {sym:String.raw`$\mathrm{RSS}_0$`, desc:String.raw`Residual sum of squares of the smaller model $M_0$ (with $p_0$ predictors)`},
          {sym:String.raw`$\mathrm{RSS}_1$`, desc:String.raw`Residual sum of squares of the larger model $M_1$ (with $p_1$ predictors)`},
          {sym:String.raw`$p_1 - p_0$`, desc:String.raw`Number of additional parameters in $M_1$ versus $M_0$`},
          {sym:String.raw`$n$`, desc:"Total number of observations"},
          {sym:String.raw`$F$`, desc:String.raw`Under $H_0$ (smaller model correct) distributed as $F_{p_1-p_0,\, n-p_1-1}$`},
        ]},
      { label:"Coefficient of determination R²", latex:String.raw`R^2 = 1 - \frac{\mathrm{RSS}}{\mathrm{TSS}} = \frac{\mathrm{RegSS}}{\mathrm{TSS}}`,
        vars:[
          {sym:String.raw`$\mathrm{RSS}$`, desc:String.raw`Residual sum of squares $\sum (y_i - \hat{y}_i)^2$`},
          {sym:String.raw`$\mathrm{TSS}$`, desc:String.raw`Total sum of squares $\sum (y_i - \bar{y})^2$ — total variance in $y$`},
          {sym:String.raw`$\mathrm{RegSS}$`, desc:String.raw`Regression sum of squares $\sum (\hat{y}_i - \bar{y})^2$ — variance explained by the model`},
          {sym:String.raw`$R^2$`, desc:String.raw`Proportion of variance explained; $R^2 \in [0,1]$, larger is better`},
        ]},
      { label:"AIC — Akaike Information Criterion", latex:String.raw`\mathrm{AIC} = -2 \max \log L + 2p`,
        vars:[
          {sym:String.raw`$\max \log L$`, desc:"Maximised log-likelihood — measures how well the model fits"},
          {sym:String.raw`$p$`, desc:"Number of estimated parameters — the penalty for complexity"},
          {sym:String.raw`$\mathrm{AIC}$`, desc:String.raw`Select the model with minimum AIC. When $\sigma^2$ unknown: $\mathrm{AIC} = n \log(\mathrm{RSS}/n) + 2p$`},
        ]},
      { label:"BIC — Bayesian Information Criterion", latex:String.raw`\mathrm{BIC} = -2 \max \log L + \log(n)\, p`,
        vars:[
          {sym:String.raw`$\log(n)$`, desc:String.raw`Natural log of sample size — grows with $n$, penalises more than AIC for $n \ge 8$ (i.e. more than $e^2 = 7.3$ observations)`},
          {sym:String.raw`$p$`, desc:"Number of parameters"},
        ]},
      { label:"Cross-validation error", latex:String.raw`\widehat{\mathrm{Err}}_{\mathrm{CV}} = \frac{1}{n} \sum_{i=1}^{n} L(y_i, \hat{y}_i)`,
        vars:[
          {sym:String.raw`$L(y_i, \hat{y}_i)$`, desc:String.raw`Loss function comparing observed $y_i$ to out-of-fold prediction $\hat{y}_i$ — quadratic $(y_i - \hat{y}_i)^2$ or absolute error`},
          {sym:String.raw`$\hat{y}_i$`, desc:String.raw`Prediction for $i$ using the model fitted on the other $q-1$ folds ($q$-fold CV; $q = 5$ or $10$ preferred, $q = n$ is leave-one-out)`},
        ]},
    ]
  },
  {
    id:3, part:"II", partLabel:"Linear Regression", num:"Ch 3",
    title:"Linear Methods",
    color:"#fdf3e8", accent:"#a85c00", icon:"🔧",
    summary:"Beyond ordinary least squares: PCR and PLS use derived components to handle correlated predictors, while Ridge and Lasso impose penalties to shrink coefficients and reduce variance.",
    figure:{ src:"assets/lasso-ridge-penalties.jpg", caption:"Figure 3.1: Penalties for Lasso (left) and Ridge (right) regression. The red ellipses are contours of the least-squares loss around the OLS solution β̂; the cyan region is the constraint. Lasso's diamond (L1) has corners on the axes, so the solution often lands at a corner where a coefficient is exactly 0 — variable selection. Ridge's disc (L2) has no corners, so it shrinks coefficients but rarely sets them to 0." },
    formulas:[
      { label:"Bias-Variance decomposition of MSE", latex:String.raw`\mathrm{MSE} = \sigma^2 + \mathrm{Var}(\hat{y}) + [\mathrm{E}(y - \hat{y})]^2`,
        vars:[
          {sym:String.raw`$\sigma^2$`, desc:"Irreducible error — inherent noise in the data, cannot be reduced"},
          {sym:String.raw`$\mathrm{Var}(\hat{y})$`, desc:String.raw`Variance of the prediction — how much $\hat{y}$ changes across different training sets`},
          {sym:String.raw`$[\mathrm{E}(y - \hat{y})]^2$`, desc:"Squared bias — systematic error; zero for unbiased estimators like OLS"},
        ]},
      { label:"Ridge regression", latex:String.raw`\hat{\beta}_{\mathrm{Ridge}} = \mathrm{argmin}\Big\{ \sum_{i=1}^{n} \big(y_i - \beta_0 - \sum_{j=1}^{p} x_{ij}\beta_j\big)^2 + \lambda \sum_{j=1}^{p} \beta_j^2 \Big\}`,
        vars:[
          {sym:String.raw`$\lambda \ge 0$`, desc:String.raw`Tuning parameter — larger $\lambda$ means stronger shrinkage toward zero`},
          {sym:String.raw`$\sum \beta_j^2$`, desc:"L2 penalty — sum of squared coefficients; penalises large coefficients"},
          {sym:String.raw`$\hat{\beta}_{\mathrm{Ridge}}$`, desc:String.raw`Closed-form solution: $(X^\top X + \lambda I)^{-1} X^\top y$ — never exactly zero, shrinks all`},
        ]},
      { label:"Lasso regression", latex:String.raw`\hat{\beta}_{\mathrm{Lasso}} = \mathrm{argmin}\Big\{ \sum_{i=1}^{n} \big(y_i - \beta_0 - \sum_{j=1}^{p} x_{ij}\beta_j\big)^2 + \lambda \sum_{j=1}^{p} |\beta_j| \Big\},\quad \text{equiv. constraint: } \sum_{j=1}^{p} |\beta_j| \le s`,
        vars:[
          {sym:String.raw`$\sum |\beta_j|$`, desc:"L1 penalty — diamond-shaped constraint drives some coefficients to exactly zero (variable selection)"},
          {sym:String.raw`$\lambda$`, desc:String.raw`Tuning parameter — increasing $\lambda$ progressively zeros out more coefficients`},
          {sym:String.raw`$s$`, desc:String.raw`Equivalent form: $\sum |\beta_j| \le s$ — directly bounds total coefficient magnitude`},
        ]},
      { label:"Ridge via SVD — shrinkage & degrees of freedom", latex:String.raw`\hat{y}_{\mathrm{Ridge}} = \sum_{j=1}^{p} u_j\, \frac{d_j^2}{d_j^2 + \lambda}\, u_j^\top y,\quad \mathrm{df}(\lambda) = \mathrm{tr}\big(X(X^\top X + \lambda I)^{-1} X^\top\big) = \sum_{j=1}^{p} \frac{d_j^2}{d_j^2 + \lambda}`,
        vars:[
          {sym:String.raw`$u_j$`, desc:String.raw`$j$-th left singular vector of $X$ (from the SVD $X = UDV^\top$) — the $j$-th principal-component direction`},
          {sym:String.raw`$d_j$`, desc:String.raw`$j$-th singular value of $X$; $d_j^2$ is proportional to the variance of principal component $j$`},
          {sym:String.raw`$\frac{d_j^2}{d_j^2+\lambda}$`, desc:String.raw`Shrinkage factor $\in (0,1]$ — ridge shrinks each component by this; low-variance (small $d_j^2$) directions are shrunk most, vs PCR which discards them entirely`},
          {sym:String.raw`$\mathrm{df}(\lambda)$`, desc:String.raw`Effective degrees of freedom; $\lambda = 0 \to p$, $\lambda \to \infty \to 0$`},
        ]},
      { label:"PCR — spectral decomposition (p. 18)", latex:String.raw`\mathrm{Cov}(X) = VAV^\top,\quad Z = XV`,
        vars:[
          {sym:String.raw`$V$`, desc:String.raw`$p \times p$ matrix of eigenvectors of $\mathrm{Cov}(X)$ — each column $v_i$ is a principal component direction`},
          {sym:String.raw`$A$`, desc:String.raw`Diagonal matrix of eigenvalues $a_1 \ge a_2 \ge \cdots \ge a_p$ — variance explained by each component`},
          {sym:String.raw`$Z$`, desc:String.raw`Score matrix — $n \times p$ matrix of principal component values; columns of $Z$ are uncorrelated`},
        ]},
      { label:"PCR — reduced model estimator (p. 19)", examHide:true, latex:String.raw`\hat{\theta}_{1:q} = (Z_{1:q}^\top Z_{1:q})^{-1} Z_{1:q}^\top y,\quad \tilde{\beta} = V_{1:q}\, \hat{\theta}_{1:q}`,
        vars:[
          {sym:String.raw`$q$`, desc:String.raw`Number of principal components retained ($1 \le q < p$) — chosen by CV`},
          {sym:String.raw`$Z_{1:q}$`, desc:String.raw`First $q$ columns of $Z$ — the $q$ most variable components of $X$`},
          {sym:String.raw`$\hat{\theta}_{1:q}$`, desc:"OLS coefficients in the reduced PC space"},
          {sym:String.raw`$\tilde{\beta}$`, desc:String.raw`Back-transformed coefficients in the original variable space: $\tilde{\beta} = V_{1:q}\, \hat{\theta}_{1:q}$`},
        ]},
      { label:"PLS — loading direction (p. 20)", latex:String.raw`w_k = \mathrm{argmax}\, \mathrm{Cov}(y, Xw)\quad \text{s.t. } \|w_k\| = 1,\ \mathrm{Cov}(Xw_k, Xw_j) = 0 \text{ for } j < k;\quad T = XW`,
        vars:[
          {sym:String.raw`$w_k$`, desc:String.raw`$k$-th PLS loading vector — direction in $X$-space most correlated with $y$`},
          {sym:String.raw`$\mathrm{Cov}(y, Xw)$`, desc:String.raw`Covariance between $y$ and the projection $Xw$ — PLS maximises this directly`},
          {sym:String.raw`$\mathrm{Cov}(Xw_k, Xw_j) = 0$`, desc:"Orthogonality constraint — each new component must be uncorrelated with previous ones"},
          {sym:String.raw`$T = XW$`, desc:String.raw`Score matrix — columns $t_k = Xw_k$ are the PLS components used for regression`},
        ]},
      { label:"Continuum regression direction (p. 20)", latex:String.raw`w_k = \mathrm{argmax}\, [\mathrm{Cov}(y, Xw)]^2\, [\mathrm{Var}(Xw)]^{\delta/(1-\delta) - 1}\quad \text{s.t. } \|w_k\| = 1,\ \mathrm{Cov}(Xw_k, Xw_j) = 0 \text{ for } j < k`,
        vars:[
          {sym:String.raw`$w_k$`, desc:String.raw`$k$-th loading direction ($k = 1, \dots, q \le p$) — regression is then done on $y$ and $T = XW$, as in PLS`},
          {sym:String.raw`$\delta \in [0,1]$`, desc:String.raw`Mixing parameter: $\delta = 0 \to$ LS, $\delta = 0.5 \to$ PLS, $\delta = 1 \to$ PCR`},
          {sym:String.raw`$\mathrm{Cov}(y, Xw)$`, desc:String.raw`Covariance between $y$ and projection $Xw$ — captures relevance for predicting $y$`},
          {sym:String.raw`$\mathrm{Var}(Xw)$`, desc:String.raw`Variance of the projection — captures how much of $X$'s structure it explains`},
        ]},
    ]
  },
  {
    id:5, part:"III", partLabel:"Linear Classification", num:"Ch 5",
    title:"Linear Classification",
    color:"#fff0f0", accent:"#a02020", icon:"🎯",
    summary:"Assigns observations to classes using linear decision boundaries. LDA assumes Gaussian classes with equal covariance; QDA relaxes that; logistic regression models class probabilities directly.",
    formulas:[
      { label:"Bayes classification rule (posterior)", latex:String.raw`P(G = k \mid x) = \frac{h_k(x)\, \pi_k}{\sum_{l=1}^{K} h_l(x)\, \pi_l}`,
        vars:[
          {sym:String.raw`$P(G = k \mid x)$`, desc:String.raw`Posterior probability that $x$ belongs to class $k$; classify $x$ to the class with the largest posterior`},
          {sym:String.raw`$h_k(x)$`, desc:String.raw`Class-conditional density (likelihood) of $x$ in class $k$ — in LDA/QDA assumed multivariate Gaussian $\varphi_k$`},
          {sym:String.raw`$\pi_k$`, desc:String.raw`Prior probability of class $k$, estimated as $n_k/n$`},
          {sym:String.raw`$\sum_l h_l(x)\, \pi_l$`, desc:"Normalising constant (total probability) — makes the posteriors sum to 1"},
        ]},
      { label:"LDA linear discriminant function", latex:String.raw`\delta_k(x) = x^\top \Sigma^{-1} \mu_k - \tfrac{1}{2} \mu_k^\top \Sigma^{-1} \mu_k + \log \pi_k`,
        vars:[
          {sym:String.raw`$x$`, desc:String.raw`New observation ($p$-dimensional feature vector) to classify`},
          {sym:String.raw`$\mu_k$`, desc:String.raw`Mean vector of class $k$ — sample mean of training points in class $k$`},
          {sym:String.raw`$\Sigma$`, desc:"Pooled (common) covariance matrix — assumed equal across all classes"},
          {sym:String.raw`$\pi_k$`, desc:String.raw`Prior probability of class $k$ — estimated as $n_k/n$`},
          {sym:String.raw`$\delta_k(x)$`, desc:String.raw`Score for class $k$; classify $x$ to $\mathrm{argmax}_k\, \delta_k(x)$`},
        ]},
      { label:"QDA quadratic discriminant function", latex:String.raw`\delta_k(x) = -\tfrac{1}{2} \log |\Sigma_k| - \tfrac{1}{2} (x - \mu_k)^\top \Sigma_k^{-1} (x - \mu_k) + \log \pi_k`,
        vars:[
          {sym:String.raw`$|\Sigma_k|$`, desc:String.raw`Determinant of class-specific covariance $\Sigma_k$ — penalises spread`},
          {sym:String.raw`$(x - \mu_k)^\top \Sigma_k^{-1} (x - \mu_k)$`, desc:String.raw`Mahalanobis distance from $x$ to class $k$ centre`},
          {sym:String.raw`$\Sigma_k$`, desc:String.raw`Class-specific covariance — QDA estimates a separate $\Sigma_k$ per class`},
        ]},
      { label:"Regularised discriminant covariance", latex:String.raw`\hat{\Sigma}_k(\alpha) = \alpha \hat{\Sigma}_k + (1 - \alpha) \hat{\Sigma}`,
        vars:[
          {sym:String.raw`$\alpha \in [0,1]$`, desc:String.raw`$\alpha = 0 \to$ LDA (pooled $\Sigma$), $\alpha = 1 \to$ QDA (class-specific $\Sigma$)`},
          {sym:String.raw`$\hat{\Sigma}_k$`, desc:String.raw`Sample covariance of class $k$`},
          {sym:String.raw`$\hat{\Sigma}$`, desc:"Pooled covariance: weighted average across all classes"},
        ]},
      { label:"Logistic regression (K classes, p. 51)", latex:String.raw`\log \frac{P(G = k \mid x)}{P(G = K \mid x)} = \beta_{k0} + \beta_k^\top x,\quad k = 1, \dots, K - 1`,
        vars:[
          {sym:String.raw`$\frac{P(G=k \mid x)}{P(G=K \mid x)}$`, desc:String.raw`Log-odds of class $k$ relative to the reference class $K$ — each pair of classes gets its own linear model`},
          {sym:String.raw`$\beta_{k0}$`, desc:String.raw`Intercept for class $k$ — one per non-reference class`},
          {sym:String.raw`$\beta_k$`, desc:String.raw`$p$-vector of coefficients for class $k$`},
          {sym:String.raw`$K$`, desc:"Reference class — choice is arbitrary; estimates are equivariant under different choices"},
          {sym:String.raw`$P(G=k \mid x)$`, desc:String.raw`Posterior probability for class $k$: $\exp\{\beta_{k0} + \beta_k^\top x\}\, /\, [1 + \sum_l \exp\{\beta_{l0} + \beta_l^\top x\}]$`},
          {sym:String.raw`$P(G=K \mid x)$`, desc:String.raw`Posterior probability for reference class $K$: $1\, /\, [1 + \sum_l \exp\{\beta_{l0} + \beta_l^\top x\}]$`},
        ]},
      { label:"Logistic regression (2 classes, p. 51)", latex:String.raw`P(G = 1 \mid x) = \frac{\exp(\beta_0 + \beta_1^\top x)}{1 + \exp(\beta_0 + \beta_1^\top x)}`,
        vars:[
          {sym:String.raw`$\beta_0$`, desc:"Intercept — shifts the decision boundary"},
          {sym:String.raw`$\beta_1$`, desc:String.raw`$p$-vector of log-odds coefficients for predictors $x$`},
          {sym:String.raw`$P(G=1 \mid x)$`, desc:"Posterior probability of class 1; threshold at 0.5 to assign class"},
        ]},
    ]
  },
  {
    id:7, part:"IV", partLabel:"Nonlinear Methods", num:"Ch 7",
    title:"Basis Expansions",
    color:"#eef5ff", accent:"#1a4a9a", icon:"〰️",
    summary:"Extends linear models to capture nonlinear patterns by replacing raw predictors with transformed versions — polynomials, splines — while keeping a linear model structure in the new features.",
    note:String.raw`Degrees of freedom = number of basis functions: a spline of order $M$ with $k$ knots has $M + k$; a natural cubic spline (forced linear beyond the boundary knots) has only $k$; a smoothing spline puts a knot at every $x_i$, but the penalty $\lambda$ shrinks the effective df to $\mathrm{df}(\lambda) = \mathrm{tr}(S_\lambda)$.`,
    formulas:[
      { label:"Basis expansion model", latex:String.raw`f(x) = \sum_{m=1}^{M} \beta_m h_m(x)`,
        vars:[
          {sym:String.raw`$f(x)$`, desc:String.raw`Modelled response — linear in the coefficients $\beta_m$ but, through the $h_m$, nonlinear in the inputs $x$`},
          {sym:String.raw`$x$`, desc:String.raw`Input vector $x \in \mathbb{R}^p$; each transformation $h_m : \mathbb{R}^p \to \mathbb{R}$ maps it to a derived feature`},
          {sym:String.raw`$h_m(x)$`, desc:String.raw`$m$-th transformation (basis function) of $x$ — $h_m(x)=x_m$ recovers the linear model, $x_j^2$ or $x_j x_k$ are quadratic, $\log(x_j)$ or $\sqrt{x_j}$ nonlinear, $I(L_m \le x_k < U_m)$ piecewise-constant`},
          {sym:String.raw`$\beta_m$`, desc:String.raw`Coefficient for the $m$-th basis function — estimated by OLS in the new space`},
          {sym:String.raw`$M$`, desc:"Total number of basis functions used"},
        ]},
      { label:"Spline basis (order M, knot ξₗ)", latex:String.raw`h_j(x) = x^{j-1} \ (j = 1, \dots, M),\quad h_{M+l}(x) = (x - \xi_l)_+^{M-1} \ (l = 1, \dots, k)`,
        vars:[
          {sym:String.raw`$h_j(x),\ h_{M+l}(x)$`, desc:String.raw`The two basis families: a global polynomial part $h_j(x)=x^{j-1}$ plus one truncated-power function $h_{M+l}(x)=(x-\xi_l)_+^{M-1}$ per knot`},
          {sym:String.raw`$M$`, desc:String.raw`Order of the spline — a piecewise polynomial of degree $M-1$ with continuous derivatives up to order $M-2$; usual choices are $M = 1, 2, 4$`},
          {sym:String.raw`$j,\ l$`, desc:String.raw`Running indices: $j = 1, \dots, M$ over the polynomial terms, $l = 1, \dots, k$ over the knots`},
          {sym:String.raw`$\xi_l$`, desc:String.raw`$l$-th knot — boundary point where polynomial pieces join; placed at data percentiles`},
          {sym:String.raw`$(x - \xi_l)_+$`, desc:String.raw`Positive part: equals $(x - \xi_l)$ if $x > \xi_l$, else zero`},
          {sym:String.raw`$M - 1$`, desc:String.raw`Degree of polynomial pieces; $M = 4$ gives cubic splines`},
          {sym:String.raw`$k$`, desc:String.raw`Number of knots — total number of basis functions = parameters = df is $M + k$ (only $k$ for natural cubic splines)`},
        ]},
      { label:"Smoothing spline — penalised criterion", latex:String.raw`\mathrm{RSS}(f, \lambda) = \sum_{i=1}^{n} \{y_i - f(x_i)\}^2 + \lambda \int [f''(t)]^2\, dt`,
        vars:[
          {sym:String.raw`$\sum_{i=1}^{n} \{y_i - f(x_i)\}^2$`, desc:String.raw`First (data-fidelity) term — the ordinary RSS measuring how closely the fit $f(x_i)$ matches the observed responses $y_i$`},
          {sym:String.raw`$f''(t)$`, desc:String.raw`Second derivative of $f$ — measures curvature; large $f''$ means a wiggly function`},
          {sym:String.raw`$\lambda$`, desc:String.raw`Smoothing parameter: $\lambda = 0$ interpolates all data; $\lambda \to \infty$ gives a straight OLS line`},
          {sym:String.raw`$\int [f''(t)]^2\, dt$`, desc:"Total curvature penalty — discourages overfitting wiggles"},
          {sym:String.raw`$n$`, desc:String.raw`Number of observations; the unique minimiser is a natural cubic spline with a knot at every $x_i$`},
        ]},
      { label:"Smoothing spline estimator", latex:String.raw`\hat{\theta} = (N^\top N + \lambda \Omega_N)^{-1} N^\top y`,
        vars:[
          {sym:String.raw`$N$`, desc:String.raw`Matrix of natural cubic spline basis functions: $\{N\}_{ij} = N_j(x_i)$`},
          {sym:String.raw`$\Omega_N$`, desc:String.raw`Roughness penalty matrix: $\{\Omega_N\}_{jk} = \int N_j''(t)\, N_k''(t)\, dt$`},
          {sym:String.raw`$\lambda$`, desc:String.raw`Smoothing parameter weighting the penalty matrix $\Omega_N$ — exactly the ridge tuning parameter, which makes $\hat{\theta}$ a generalised ridge estimator`},
          {sym:String.raw`$y$`, desc:String.raw`$n$-vector of observed responses $(y_1, \dots, y_n)$`},
          {sym:String.raw`$\hat{\theta}$`, desc:String.raw`Spline coefficients — analogous to Ridge regression with penalty matrix $\lambda \Omega_N$`},
        ]},
      { label:"Smoother matrix & effective degrees of freedom", latex:String.raw`\hat{f}_\lambda = S_\lambda y,\quad \mathrm{df}(\lambda) = \mathrm{tr}(S_\lambda)`,
        vars:[
          {sym:String.raw`$S_\lambda$`, desc:String.raw`Smoother matrix $S_\lambda = N(N^\top N + \lambda \Omega_N)^{-1} N^\top$ — depends only on the $x_i$ and $\lambda$, not on $y$; the fit is linear in $y$`},
          {sym:String.raw`$y$`, desc:String.raw`$n$-vector of observed responses; because $S_\lambda$ ignores $y$, the smoother is a fixed linear operator`},
          {sym:String.raw`$\hat{f}_\lambda$`, desc:String.raw`Vector of fitted values for the chosen $\lambda$`},
          {sym:String.raw`$\mathrm{tr}(S_\lambda)$`, desc:String.raw`Trace — the sum of the diagonal elements of $S_\lambda$`},
          {sym:String.raw`$\mathrm{df}(\lambda)$`, desc:String.raw`Effective degrees of freedom $= \mathrm{tr}(S_\lambda)$; used to set $\lambda$ (e.g. by generalised cross-validation)`},
        ]},
    ]
  },
  {
    id:9, part:"IV", partLabel:"Nonlinear Methods", num:"Ch 9",
    title:"Generalized Additive Models",
    color:"#eefaf3", accent:"#1a7a4a", icon:"📈",
    summary:"GAMs replace each linear term βⱼxⱼ with an unknown smooth function fⱼ(xⱼ). The backfitting algorithm estimates each function by iteratively fitting it to the residuals from all others.",
    note:String.raw`Backfitting: initialise $\hat{\alpha} = \bar{y}$, $\hat{f}_j \equiv 0$; cycle $j = 1, \dots, p$ fitting $\hat{f}_j \leftarrow S_j[\text{residuals}]$ until convergence.`,
    formulas:[
      { label:"GAM model via link function g", latex:String.raw`g[\mu(x)] = \alpha + f_1(x_1) + f_2(x_2) + \cdots + f_p(x_p)`,
        vars:[
          {sym:String.raw`$g(\cdot)$`, desc:String.raw`Link function: identity $g(\mu) = \mu$ for regression; logit $g(\mu) = \log(\mu/(1-\mu))$ for classification`},
          {sym:String.raw`$\mu(x)$`, desc:String.raw`Conditional mean of $y$ given predictors $x$: $\mu(x) = \mathrm{E}(y \mid x)$`},
          {sym:String.raw`$f_j(x_j)$`, desc:String.raw`Unknown smooth function for predictor $j$ — estimated as a cubic smoothing spline`},
          {sym:String.raw`$\alpha$`, desc:String.raw`Intercept — estimated as the overall mean $\bar{y}$`},
        ]},
      { label:"Penalised RSS (PRSS)", latex:String.raw`\mathrm{PRSS} = \sum_{i=1}^{n} \Big\{ y_i - \alpha - \sum_{j=1}^{p} f_j(x_{ij}) \Big\}^2 + \sum_{j=1}^{p} \lambda_j \int [f_j''(t_j)]^2\, dt_j`,
        vars:[
          {sym:String.raw`$\lambda_j$`, desc:String.raw`Per-predictor smoothing parameter — controls how wiggly $f_j$ can be`},
          {sym:String.raw`$\int [f_j''(t_j)]^2\, dt_j$`, desc:String.raw`Roughness of $f_j$ — penalises non-linearity for predictor $j$ independently`},
        ]},
      { label:"Backfitting update", latex:String.raw`\hat{f}_j \leftarrow S_j\Big[\, y_i - \hat{\alpha} - \sum_{k \ne j} \hat{f}_k(x_{ik}) \Big],\quad \hat{\alpha} = \mathrm{ave}(y_i)`,
        vars:[
          {sym:String.raw`$S_j$`, desc:String.raw`Cubic smoothing-spline smoother for predictor $j$`},
          {sym:String.raw`$y_i - \hat{\alpha} - \sum_{k \ne j} \hat{f}_k(x_{ik})$`, desc:String.raw`Partial residuals — the part of $y$ not yet explained by the other functions; $\hat{f}_j$ is fitted to these, cycling $j = 1, \dots, p$ until the $\hat{f}_j$ stabilise`},
          {sym:String.raw`$\hat{\alpha}$`, desc:String.raw`Intercept, the overall mean $\mathrm{ave}(y_i)$; each $\hat{f}_j$ is re-centred to sum to zero`},
        ]},
    ]
  },
  {
    id:11, part:"IV", partLabel:"Nonlinear Methods", num:"Ch 11",
    title:"Tree-Based Methods",
    color:"#fffbe8", accent:"#7a6000", icon:"🌳",
    summary:"Decision trees recursively partition the feature space into rectangular regions, fitting a constant in each. Regression trees predict the mean; classification trees the majority class. Random Forests average many trees for stability.",
    formulas:[
      { label:"Best split criterion (regression)", latex:String.raw`\min_{j,s} \Big[ \min_{c_1} \sum_{x_i \in R_1} (y_i - c_1)^2 + \min_{c_2} \sum_{x_i \in R_2} (y_i - c_2)^2 \Big]`,
        vars:[
          {sym:String.raw`$j$`, desc:"Split variable — which predictor to split on"},
          {sym:String.raw`$s$`, desc:String.raw`Split point — threshold value along predictor $j$`},
          {sym:String.raw`$R_1(j,s)$`, desc:String.raw`Left region: observations with $x_j \le s$`},
          {sym:String.raw`$R_2(j,s)$`, desc:String.raw`Right region: observations with $x_j > s$`},
          {sym:String.raw`$y_i$`, desc:String.raw`Response (target) value of observation $i$ — the numeric output being predicted`},
          {sym:String.raw`$x_i$`, desc:String.raw`Predictor vector of observation $i$; $x_j$ is its value on the split variable $j$`},
          {sym:String.raw`$c_1, c_2$`, desc:String.raw`Constant predictions in each region — optimum is $\hat{c}_m = \mathrm{ave}(y_i \mid x_i \in R_m)$, the mean $y$ in that region`},
        ]},
      { label:"Cost-complexity pruning", latex:String.raw`c_\alpha(T) = \sum_{m=1}^{|T|} n_m Q_m(T) + \alpha |T|`,
        vars:[
          {sym:String.raw`$|T|$`, desc:"Number of terminal (leaf) nodes — proxy for model complexity"},
          {sym:String.raw`$n_m$`, desc:String.raw`Number of observations in terminal node $m$`},
          {sym:String.raw`$Q_m(T)$`, desc:"Node impurity: MSE for regression; Gini or entropy for classification"},
          {sym:String.raw`$\alpha \ge 0$`, desc:String.raw`Pruning parameter: $\alpha = 0$ keeps full tree; large $\alpha$ yields small tree`},
        ]},
      { label:"Gini index (classification)", latex:String.raw`\mathrm{Gini} = \sum_{k=1}^{K} \hat{p}_{mk} (1 - \hat{p}_{mk})`,
        vars:[
          {sym:String.raw`$\hat{p}_{mk}$`, desc:String.raw`Proportion of class $k$ observations in node $m$`},
          {sym:String.raw`$\mathrm{Gini} = 0$`, desc:"Pure node — all observations belong to one class"},
          {sym:String.raw`$\mathrm{Gini} \to \max$`, desc:String.raw`Impure node — classes equally distributed; max $= 1 - 1/K$`},
        ]},
      { label:"Other impurity measures (classification)", latex:String.raw`\mathrm{Entropy} = -\sum_{k=1}^{K} \hat{p}_{mk} \log \hat{p}_{mk},\quad \text{Misclass.} = 1 - \hat{p}_{m k(m)}`,
        vars:[
          {sym:String.raw`$\hat{p}_{mk}$`, desc:String.raw`Proportion of class $k$ observations in node $m$`},
          {sym:String.raw`$k(m)$`, desc:String.raw`Majority class in node $m$, $k(m) = \mathrm{argmax}_k\, \hat{p}_{mk}$; misclassification error is 1 minus its proportion`},
          {sym:"Entropy", desc:"Cross-entropy / deviance — like Gini it is differentiable, so preferred over misclassification when growing the tree"},
        ]},
      { label:"Random Forest variable importance", latex:String.raw`\hat{\theta}_j = \frac{1}{B} \sum_{b=1}^{B} \delta_{bj},\quad \delta_{bj} = \pi_{bj} - \pi_b`,
        vars:[
          {sym:String.raw`$B$`, desc:"Number of trees in the forest"},
          {sym:String.raw`$\pi_b$`, desc:String.raw`Impurity of tree $b$ on OOB (out-of-bag) data`},
          {sym:String.raw`$\pi_{bj}$`, desc:String.raw`Impurity after randomly permuting predictor $j$ in OOB data`},
          {sym:String.raw`$\delta_{bj}$`, desc:String.raw`Impurity increase from permuting $j$ — $j$'s contribution to prediction accuracy`},
          {sym:String.raw`$\hat{\theta}_j$`, desc:String.raw`Variable importance: average impurity increase across all $B$ trees`},
        ]},
    ]
  },
  {
    id:13, part:"IV", partLabel:"Nonlinear Methods", num:"Ch 13",
    title:"Support Vector Machines",
    color:"#f5eaf8", accent:"#7a1a9a", icon:"🔬",
    summary:"SVMs find the maximum-margin hyperplane separating two classes. Slack variables handle non-separable cases. The kernel trick implicitly maps data to higher dimensions for nonlinear boundaries.",
    formulas:[
      { label:"Hyperplane definition", latex:String.raw`f(x) = \beta_0 + \beta^\top x = 0`,
        vars:[
          {sym:String.raw`$f(x)$`, desc:String.raw`Signed value for point $x$ — equals 0 on the hyperplane, positive one side, negative the other`},
          {sym:String.raw`$\beta_0$`, desc:"Bias (intercept) — shifts the hyperplane away from the origin"},
          {sym:String.raw`$\beta$`, desc:String.raw`Raw (unnormalised) weight vector — points perpendicular to the hyperplane; $\beta^\top x$ is the dot product $\beta_1 x_1 + \cdots + \beta_p x_p$. Note $\beta/\|\beta\|$ is the unit normal`},
          {sym:String.raw`$x$`, desc:String.raw`Input point ($p$-dimensional feature vector) being evaluated`},
        ]},
      { label:"Max-margin optimisation (separable)", latex:String.raw`\min \|\beta\| \quad \text{s.t. } g_i(x_i^\top \beta + \beta_0) \ge 1 \ \forall i`,
        vars:[
          {sym:String.raw`$g_i \in \{-1, +1\}$`, desc:String.raw`Class label of observation $i$`},
          {sym:String.raw`$\|\beta\|$`, desc:String.raw`Norm of weight vector — margin $M = 1/\|\beta\|$; minimising $\|\beta\|$ maximises $M$`},
          {sym:String.raw`$g_i(x_i^\top \beta + \beta_0) \ge 1$`, desc:String.raw`Margin constraint — each point must be $\ge M$ away from the boundary`},
        ]},
      { label:"Non-separable case with slack variables", latex:String.raw`\min\, \tfrac{1}{2}\|\beta\|^2 + C \sum_{i=1}^{n} \xi_i \quad \text{s.t. } g_i(x_i^\top \beta + \beta_0) \ge 1 - \xi_i,\ \xi_i \ge 0`,
        vars:[
          {sym:String.raw`$\xi_i \ge 0$`, desc:String.raw`Slack variable — how far observation $i$ is on the wrong side of its margin`},
          {sym:String.raw`$C > 0$`, desc:String.raw`Cost parameter: large $C \to$ narrow margin; small $C \to$ wide margin`},
          {sym:String.raw`$\sum_i \xi_i$`, desc:String.raw`Total constraint violation; $\xi_i > 1$ means observation $i$ is misclassified`},
        ]},
      { label:"Solution & support vectors (KKT)", latex:String.raw`\beta = \sum_{i=1}^{n} \alpha_i g_i x_i,\quad \sum_{i=1}^{n} \alpha_i g_i = 0,\quad 0 \le \alpha_i \ (\le C)`,
        vars:[
          {sym:String.raw`$\alpha_i$`, desc:String.raw`Lagrange multiplier (weight) of point $i$, solved by the KKT conditions: $\alpha_i = 0$ → ignored, $\alpha_i > 0$ → support vector. Bounded $0 \le \alpha_i \le C$ ($C = \infty$ if separable)`},
          {sym:String.raw`$g_i \in \{-1,+1\}$`, desc:String.raw`Class label of point $i$ (other texts call it $t_i$) — gives the sign, while $\alpha_i$ gives the magnitude`},
          {sym:String.raw`$x_i$`, desc:String.raw`The $p$-dimensional input feature vector of point $i$`},
          {sym:String.raw`$\beta$`, desc:String.raw`Weight vector is a linear combination of the training points, $\beta = \sum_i \alpha_i g_i x_i$ — each point $x_i$ enters with sign $g_i$ and weight $\alpha_i$, so only those with $\alpha_i > 0$ (the support vectors) contribute`},
          {sym:"support vectors", desc:String.raw`The points with $\alpha_i > 0$: on the margin ($0 < \alpha_i < C$) or, when non-separable, inside/wrong side ($\alpha_i = C$). $\beta_0$ is recovered from any margin SV via $g_i(x_i^\top \beta + \beta_0) = 1$`},
        ]},
      { label:"Kernel function & kernel trick", latex:String.raw`K(u, v) = \langle h(u), h(v) \rangle;\quad f(x) = \sum_{i=1}^{n} \alpha_i g_i \langle h(x), h(x_i) \rangle + \beta_0`,
        vars:[
          {sym:String.raw`$u, v$`, desc:String.raw`Two input observations ($p$-dimensional feature vectors) being compared`},
          {sym:String.raw`$h(\cdot)$`, desc:"Implicit mapping to higher-dimensional space — never computed explicitly"},
          {sym:String.raw`$K(u,v)$`, desc:String.raw`Kernel — computes the inner product $\langle h(u), h(v) \rangle$ in the transformed space directly`},
          {sym:String.raw`$f(x)$`, desc:String.raw`The solution involves $h$ only through inner products — that is the trick: replace every $\langle h(\cdot), h(\cdot) \rangle$ by $K(\cdot, \cdot)$ and $h$ never needs to be specified`},
          {sym:String.raw`$\beta_0$`, desc:String.raw`Bias (intercept) — constant offset outside the sum, recovered from any margin support vector`},
        ]},
